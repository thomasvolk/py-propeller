[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-propeller"
version = "0.6.0"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Thomas Volk", email = "info@thomasvolk.de"}]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["propeller"]

[tool.hatch.build.targets.sdist]
include = ["examples/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
